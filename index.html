<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abdul | Cloud & DevOps Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
    --bg: #070914;
    --panel: #101426;
    --cyan: #58e6ff;
    --purple: #a78bfa;
    --text: #f4f6ff;
    --muted: #9ca7c5;
    --border: rgba(157, 177, 255, .15);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.7;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
        radial-gradient(ellipse at 15% 10%, #163b5b55, transparent 40%),
        radial-gradient(ellipse at 85% 35%, #54267b38, transparent 38%),
        radial-gradient(ellipse at 50% 90%, #123d5940, transparent 42%);
}

a {
    color: inherit;
    text-decoration: none;
}
